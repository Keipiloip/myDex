<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <nav class="navbar">
        <img src="Img/myDex Logo.png" width="80" alt="Pokeball logo">
        <ul class="nav-lenker">
            <a href="Index.html">Home</a>
            <a href="Pokedex.html">Pokedex</a>
        </ul>
    </nav>

    <main class="Main_content">
        <div class="pokedex-header">
        <h2>Pokédex</h2>
        <p>Her er en oversikt over alle Pokémonene du eier!</p>
        </div>

        <template id="card-template">
            <div class="card"> 
                <div class="card-top">
                    <p>#1</p>
                    <img class="sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/1.png" alt="Pokemon sprite">
                    <div class="type-icons">
                        <img class="type-icon" src="img/Energy/grass_type.png" alt="Grass Type">
                        <img class="type-icon" src="img/Energy/poison_type.png" alt="Poison Type">
                    </div>
                </div>
                <div class="card-bottom">
                    <p class="name">Bulbasaur</p>
                    <p class="small">Level: 5</p>
                </div>
            </div>
        </template>

        <div id="pokedex-container" class="card-grid"></div>

        

    <script>
        const container = document.getElementById('pokedex-container');
        const template = document.getElementById('card-template');
        
        function getTypeIcon(type) {
            if (!type) return null;
            const normalized = type.trim().toLowerCase();
            const map = {
                grass: 'grass_type.png',
                poison: 'poison_type.png',
                fire: 'fire_type.png',
                water: 'water_type.png',
                electric: 'electric_type.png',
                rock: 'rock_type.png',
                ground: 'ground_type.png',
                flying: 'flying_type.png',
                psychic: 'psychic_type.png',
                ice: 'ice_type.png',
                dragon: 'dragon_type.png',
                dark: 'dark_type.png',
                fairy: 'fairy_type.png',
                steel: 'steel_type.png',
                bug: 'bug_type.png',
                ghost: 'ghost_type.png',
                normal: 'normal_type.png'
            };
            const fileName = map[normalized] || `${normalized}_type.png`;
            return `img/Energy/${fileName}`;
        }

        function createCard(pokemon) {
            const fragment = template.content.cloneNode(true);
            const card = fragment.querySelector('.card');
            const idLabel = card.querySelector('.card-top p');
            const sprite = card.querySelector('.sprite');
            const nameText = card.querySelector('.name');
            const levelText = card.querySelector('.small');
            const typeIcons = card.querySelector('.type-icons');

            const idValue =     pokemon.dex_id || '';
            const nameValue =   pokemon.Navn || '';
            const levelValue =  pokemon.Level || '';
            const typeValue =   pokemon.Type || '';
            const type2Value =  pokemon.Type2 || '';

            idLabel.textContent = idValue ? `#${idValue}` : '#?';
            sprite.src = '';
            sprite.alt = nameValue;
            nameText.textContent = nameValue;
            levelText.textContent = `Level: ${levelValue}`;

            typeIcons.innerHTML = '';
            const firstIcon = getTypeIcon(typeValue);
            if (firstIcon) {
                const icon = document.createElement('img');
                icon.className = 'type-icon';
                icon.src = firstIcon;
                icon.alt = typeValue;
                typeIcons.appendChild(icon);
            }
            const secondIcon = getTypeIcon(type2Value);
            if (secondIcon) {
                const icon = document.createElement('img');
                icon.className = 'type-icon';
                icon.src = secondIcon;
                icon.alt = type2Value;
                typeIcons.appendChild(icon);
            }

            const apiName = nameValue.trim().toLowerCase().replace(/\s+/g, '-');
            if (apiName) {
                fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(apiName)}`)
                    .then(response => response.json())
                    .then(apiData => {
                        if (apiData.id) {
                            idLabel.textContent = `#${apiData.id}`;
                        }
                        if (apiData.sprites && apiData.sprites.other && apiData.sprites.other.home && apiData.sprites.other.home.front_default) {
                            sprite.src = apiData.sprites.other.home.front_default;
                        } else if (apiData.sprites && apiData.sprites.front_default) {
                            sprite.src = apiData.sprites.front_default;
                        }
                    })
                    .catch(error => {
                        console.error('PokeAPI fetch error for', apiName, error);
                    });
            }

            return fragment;
        }

        fetch('/api/pokemon')
            .then(response => response.json())
            .then(data => {
                container.innerHTML = '';
                if (!Array.isArray(data) || data.length === 0) {
                    container.textContent = 'Ingen Pokémon funnet ennå.';
                    return;
                }
                data.forEach(pokemon => container.appendChild(createCard(pokemon)));
            })
            .catch(error => {
                container.textContent = 'Error fetching data.';
                console.error(error);
            });
    </script>
    </main>
</body>
</html>
