<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <nav class="navbar">
        <img src="Img/myDex Logo.png" width="80" alt="Pokeball logo">
        <ul class="nav-lenker">
            <a href="Index.html">Home</a>
            <a href="Pokedex.html">Pokedex</a>
        </ul>
    </nav>

    <main class="Main_content">
        <h2>Pokédex</h2>
        <p>Her kommer en oversikt over alle Pokémonene du har lagt til i din Pokédex!</p>
    
        <div class="card"> 
            <div class="card-top">
                <p>#1</p>
                <img class="sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/1.png">
                
                <div class="type-icons">
                <img class="type-icon" src="img/Energy/grass_type.png" alt="Grass Type">
                <img class="type-icon" src="img/Energy/poison_type.png" alt="Poison Type">
            </div>
                
            </div>
  
            <div class="card-bottom">
                <p>Bulbasaur</p>
                <p class ="small">Level: 5</p>
            
            </div>

        </div>

        <div id="pokedex-container"></div>

        

    <script>
        // Fetch data from the server
        fetch('/api/pokemon')
            .then(response => response.json()) // Convert the response to JSON
            .then(data => {
                // Find the div where the data will be displayed
                const container = document.getElementById('pokedex-container');

                // Create a bullet list
                const list = document.createElement('ul');

                // Loop through each Pokémon in the list
                data.forEach(pokemon => {
                    const li = document.createElement('li');

                    // Display name, dex ID, type and secondary type
                    li.textContent =
                        pokemon.Navn + ' ' +
                        "Dex Id:" + pokemon.dex_id + ' ' +
                        "lvl" + pokemon.Level + ' ' +
                        pokemon.Type + ' / ' +
                        pokemon.Type2;

                    const img = document.createElement('img');
                    fetch(`https://pokeapi.co/api/v2/pokemon/${pokemon.Navn}`)
                        .then(response => response.json())
                        .then(apiData => {
                            img.src = apiData.sprites.other.home.front_default;
                        })
                        .catch(apiError => {
                            console.error('Sprite fetch error', apiError);
                        });

                    li.appendChild(img);

                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete';
                    deleteButton.onclick = () => slettBruker(pokemon.id);

                    const editButton = document.createElement('button');
                    editButton.textContent = 'Edit';
                    editButton.onclick = () => redigerBruker(pokemon.id, pokemon.Navn, pokemon.dex_id, pokemon.Level, pokemon.Type, pokemon.Type2);

                    li.appendChild(deleteButton);
                    li.appendChild(editButton);

                    list.appendChild(li);
                });

                // Add the list to the page
                container.appendChild(list);
            })
            .catch(error => {
                // Show an error message if something goes wrong
                document.getElementById('pokedex-container').textContent = 'Error fetching data.';

                // Show the error in the console
                console.error(error);
            });

function slettBruker(id) {
  fetch('/api/pokemon/' + id, {
    method: 'DELETE'
  })
    .then(response => response.json())
    .then(data => {
      alert(data.message);
      location.reload();
    })
    .catch(error => {
      console.error(error);
      alert('Error with deletion');
    });
}

function redigerBruker(id, oldNavn, oldDexId, oldLevel, oldType, oldType2) {
    const newNavn = prompt('write new name:', oldNavn);
    const newdex_id = prompt('write new Dex ID:', oldDexId);
    const newLevel = prompt('write new Level:', oldLevel);
    const newType = prompt('write new Type:', oldType);
    const newType2 = prompt('write new Type 2:', oldType2);

    if (newNavn === null || newdex_id === null || newLevel === null || newType === null || newType2 === null) {
        return;
    }

    fetch('/api/pokemon/' + id, {
        method: 'PUT',
        headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
        navn: newNavn,
        dex_id: newdex_id,
        Level: newLevel,
        Type: newType,
        Type2: newType2
    })
  })
    .then(response => response.json())
    .then(data => {
      alert(data.message);
      location.reload();
    })
    .catch(error => {
      console.error(error);
      alert('Error with editing');
    });
}
      </script>
    </main>
</body>
</html>
